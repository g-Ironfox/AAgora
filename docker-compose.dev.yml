# docker-compose.dev.yml — 开发调试覆盖配置(仅本地开发使用)
#
# 用法:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# 与正式配置(docker-compose.yml)的区别:
#   - webui 挂载宿主机源码,修改后无需重新构建镜像
#   - webui 等待 redis / mongodb 健康检查通过后再启动(正式配置只等 mongodb)
#   - redis / mongodb 暴露宿主机端口,方便用本机工具排查数据
#
# 发布时不要叠加本文件,直接使用 docker-compose.yml 即可。

services:
  webui:
    volumes:
      - ./webui:/app
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  redis:
    ports:
      - "6380:6379"

  mongodb:
    ports:
      - "27019:27017"
